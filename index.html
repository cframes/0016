<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
/>

<title>Professional Stable AR</title>

<!-- AFRAME -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<!-- MINDAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

body {
  position: fixed;
  inset: 0;
}

canvas {
  display: block;
  image-rendering: auto;
}

#loading {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  color: #fff;
  font-size: 18px;
  letter-spacing: .5px;
  transition: opacity .3s ease;
}

#loading.hide {
  opacity: 0;
  pointer-events: none;
}

#tap {
  position: fixed;
  left: 50%;
  bottom: 25px;
  transform: translateX(-50%);
  padding: 12px 18px;
  background: rgba(0,0,0,.72);
  color: #fff;
  font-size: 14px;
  border-radius: 14px;
  z-index: 999;
  backdrop-filter: blur(10px);
}

#tap.hide {
  display: none;
}

</style>
</head>

<body>

<div id="loading">Loading AR...</div>

<div id="tap">Tap once to enable audio</div>

<a-scene

  embedded

  vr-mode-ui="enabled:false"

  device-orientation-permission-ui="enabled:false"

  color-space="sRGB"

  renderer="
    alpha:true;
    antialias:false;
    precision:mediump;
    colorManagement:true;
    sortObjects:true;
    physicallyCorrectLights:false;
    logarithmicDepthBuffer:false;
    powerPreference:high-performance;
  "

  mindar-image="
    imageTargetSrc: targets.mind;
    autoStart: true;
    uiLoading: no;
    uiScanning: yes;
    uiError: no;
    maxTrack: 1;
    filterMinCF: 0.0001;
    filterBeta: 0.001;
    warmupTolerance: 5;
    missTolerance: 3;
  "

>

  <a-assets timeout="20000">

    <video
      id="video"
      src="video.mp4"
      preload="auto"
      crossorigin="anonymous"
      loop
      playsinline
      webkit-playsinline
      muted
    ></video>

  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled:false"
  ></a-camera>

  <a-entity
    id="target"
    mindar-image-target="targetIndex:0"
  >

    <a-video
      id="videoPlane"
      src="#video"
      position="0 0 0.001"
      width="1"
      height="1.5"
      material="
        shader:flat;
        transparent:false;
        depthTest:true;
        depthWrite:true;
        toneMapped:false;
      "
    ></a-video>

  </a-entity>

</a-scene>

<script>

const scene      = document.querySelector("a-scene");
const video      = document.querySelector("#video");
const target     = document.querySelector("#target");
const videoPlane = document.querySelector("#videoPlane");
const loading    = document.querySelector("#loading");
const tapUI      = document.querySelector("#tap");

let tracking      = false;
let audioUnlocked = false;
let lostTimeout   = null;


// ── LOADING HIDE ──────────────────────────────────────────
scene.addEventListener("renderstart", () => {
  setTimeout(() => loading.classList.add("hide"), 300);
});


// ── VIDEO FIT (aspect ratio auto) ─────────────────────────
video.addEventListener("loadedmetadata", () => {
  const vw    = video.videoWidth;
  const vh    = video.videoHeight;
  const ratio = vw / vh;

  if (ratio > 1) {
    videoPlane.setAttribute("width",  ratio);
    videoPlane.setAttribute("height", 1);
  } else {
    videoPlane.setAttribute("width",  1);
    videoPlane.setAttribute("height", 1 / ratio);
  }
});


// ── PRELOAD VIDEO (muted – bypasses autoplay block) ───────
async function preloadVideo() {
  try {
    video.muted = true;
    await video.play();
    video.pause();
    video.currentTime = 0;
  } catch(e) {}
}
window.addEventListener("load", preloadVideo);


// ── AUDIO UNLOCK (iOS / Android first-touch rule) ─────────
async function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  try {
    video.muted = false;
    await video.play();
    video.pause();
    video.currentTime = 0;
  } catch(e) {}
  tapUI.classList.add("hide");
}
document.body.addEventListener("click",      unlockAudio, { once: true });
document.body.addEventListener("touchstart", unlockAudio, { once: true });


// ── TARGET FOUND ──────────────────────────────────────────
target.addEventListener("targetFound", async () => {
  clearTimeout(lostTimeout);
  if (tracking) return;
  tracking = true;

  try {
    video.muted       = !audioUnlocked;
    video.currentTime = 0;
    await video.play();
  } catch(e) {}
});


// ── TARGET LOST ───────────────────────────────────────────
target.addEventListener("targetLost", () => {
  lostTimeout = setTimeout(() => {
    tracking = false;
    video.pause();
  }, 120);
});


// ── PAGE VISIBILITY ───────────────────────────────────────
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    video.pause();
  } else {
    if (tracking) video.play();
  }
});


// ── iOS INLINE PLAY FIX ───────────────────────────────────
video.setAttribute("playsinline",       "");
video.setAttribute("webkit-playsinline","");


// ── VIDEO TEXTURE UPDATER (Android fix) ──────────────────
// Forces GPU texture refresh every frame so video plays
// smoothly on Android Chrome without skewing / freezing.
AFRAME.registerComponent("video-updater", {
  init: function() {
    this.mesh = null;
  },
  tick: function() {
    if (!this.mesh) {
      this.mesh = this.el.getObject3D("mesh");
    }
    if (this.mesh && video.readyState >= 2) {
      const mat = this.mesh.material;
      if (mat && mat.map) {
        mat.map.needsUpdate = true;
      }
    }
  }
});
videoPlane.setAttribute("video-updater", "");


// ── VISIBILITY HANDLER (hide mesh when not tracking) ─────
AFRAME.registerComponent("visibility-handler", {
  tick: function() {
    this.el.object3D.visible = tracking;
  }
});
videoPlane.setAttribute("visibility-handler", "");

</script>

</body>
</html>
